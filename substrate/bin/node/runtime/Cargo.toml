[package]
name = "kitchensink-runtime"
version = "3.0.0-dev"
authors.workspace = true
description = "Substrate node kitchensink runtime."
edition.workspace = true
build = "build.rs"
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
# third-party dependencies
array-bytes = { workspace = true }
codec = { features = ["derive", "max-encoded-len"], workspace = true }
log = { workspace = true }
rand = { workspace = true, optional = true }
rand_pcg = { workspace = true, optional = true }
scale-info = { features = ["derive", "serde"], workspace = true }
serde_json = { features = ["alloc", "arbitrary_precision"], workspace = true }
sp-debug-derive = { workspace = true }
static_assertions = { workspace = true, default-features = true }

# pallet-asset-conversion: turn on "num-traits" feature
primitive-types = { features = ["codec", "num-traits", "scale-info"], workspace = true }

polkadot-sdk = { features = ["runtime-full", "tuples-96"], workspace = true }

# shared code between runtime and node
node-primitives = { workspace = true }

# Example pallets that are not published:
pallet-example-mbm = { workspace = true }
pallet-example-tasks = { workspace = true }
pallet-transaction-storage = { workspace = true }

# Pallets that are not part of the umbrella crate:
pallet-registrar-para = { workspace = true }
pallet-registrar-relay = { workspace = true }
registrar-primitives = { workspace = true }

[build-dependencies]
substrate-wasm-builder = { optional = true, workspace = true, default-features = true }

[features]
default = ["std"]
with-tracing = ["polkadot-sdk/with-tracing"]
std = [
	"codec/std",
	"log/std",
	"node-primitives/std",
	"pallet-example-mbm/std",
	"pallet-example-tasks/std",
	"pallet-registrar-para/std",
	"pallet-registrar-relay/std",
	"pallet-transaction-storage/std",
	"polkadot-sdk/std",
	"primitive-types/std",
	"rand?/std",
	"registrar-primitives/std",
	"scale-info/std",
	"serde_json/std",
	"sp-debug-derive/std",
	"substrate-wasm-builder",
]
runtime-benchmarks = [
	"pallet-example-mbm/runtime-benchmarks",
	"pallet-example-tasks/runtime-benchmarks",
	"pallet-registrar-para/runtime-benchmarks",
	"pallet-registrar-relay/runtime-benchmarks",
	"pallet-transaction-storage/runtime-benchmarks",
	"polkadot-sdk/runtime-benchmarks",
	"rand",
	"rand_pcg",
]
try-runtime = [
	"pallet-example-mbm/try-runtime",
	"pallet-example-tasks/try-runtime",
	"pallet-registrar-para/try-runtime",
	"pallet-registrar-relay/try-runtime",
	"pallet-transaction-storage/try-runtime",
	"polkadot-sdk/try-runtime",
]
experimental = [
	"pallet-example-tasks/experimental",
]
metadata-hash = ["substrate-wasm-builder/metadata-hash"]
