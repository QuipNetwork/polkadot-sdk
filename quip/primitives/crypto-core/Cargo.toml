[package]
name = "quip-crypto-primitives-core"
version = "0.1.0"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# These component crates are used only to validate fixed-buffer key encodings
# and recover public keys from imported secrets. All key derivation, message
# binding, signing, and verification delegate to pqhybridsign.
schnorrkel = { workspace = true, default-features = false }
ed25519-zebra = { version = "4", default-features = false }
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-44"]}
zeroize = { version = "1", default-features = false, features = ["derive"] }
rand_core = { version = "0.6", default-features = false  } # can't be bumped due to schnorrkel and fips204 depending on this api version.
thiserror = { version = "1", optional = true }
pqhybridsign = { git = "ssh://git@gitlab.com/quip.network/pqhybridsign.git", rev = "330596f453ffb9de30d965352227f536731a6c8e", default-features = false, features = ["alloc"] }
fn-dsa = { version = "0.4.0", default-features = false }

[features]
default = ["std"]
std = [
    "dep:thiserror",
    "rand_core/std",
    "zeroize/std",
    "schnorrkel/std",
    "ed25519-zebra/std",
    "fips204/default",
    "pqhybridsign/std",
]

[dev-dependencies]
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
