name: Release - Publish draft

# This workflow runs in paritytech-release and creates full release draft with:
# - release notes
# - info about the runtimes
# - attached artifacts:
#   - runtimes
#   - binaries
#   - signatures

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag matching the actual release candidate with the format polkadot-stableYYMM(-X)-rcX or polkadot-stableYYMM(-X)
        required: true
        type: string
      build_run_id:
        description: Run ID of the current release workflow run to be used to download the artifacts
        required: true
        type: string
      runtimes:
        description: Runtimes to be published (⚠️ this needs to be provided in case of the complete release, for the crates only release or a patch release without runtimes it is not needed)
      no_runtimes:
        description: If true, release draft will be published without runtimes
        required: true
        type: boolean
        default: false
      crates_only:
        description: If true, release draft will contain only release notes and no artifacts will be published (needed for stable releases that are crates only)
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_tag:
        description: Tag matching the actual release candidate with the format polkadot-stableYYMM(-X)-rcY or polkadot-stableYYMM(-X)
        required: true
        type: string
      build_run_id:
        description: Run ID of the current release workflow run to be used to download the artifacts
        required: true
        type: string
      runtimes:
        description: Runtimes to be published
        type: string
      no_runtimes:
        description: If true, release draft will be published without runtimes
        required: true
        type: boolean
        default: false
      crates_only:
        description: If true, release draft will contain only release notes and no artifacts will be published (needed for stable releases that are crates only)
        required: true
        type: boolean
        default: false

jobs:
  check-synchronization:
    uses: paritytech-release/sync-workflows/.github/workflows/check-synchronization.yml@main
    with:
      concurrency_suffix: publish-release-draft
    secrets:
      fork_writer_app_key: ${{ secrets.UPSTREAM_CONTENT_SYNC_APP_KEY }}

  validate-inputs:
    needs: [ check-synchronization ]
    if: needs.check-synchronization.outputs.checks_passed == 'true'
    runs-on: ubuntu-latest
    outputs:
        release_tag: ${{ steps.validate_inputs.outputs.release_tag }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate inputs
        id: validate_inputs
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          . ./.github/scripts/common/lib.sh

          RELEASE_TAG=$(validate_stable_tag "$INPUT_RELEASE_TAG")
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT


  publish-release-draft:
    runs-on: ubuntu-latest
    environment: release
    needs: [ validate-inputs ]
    outputs:
      release_url: ${{ steps.create-release.outputs.html_url }}
      asset_upload_url: ${{ steps.create-release.outputs.upload_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate content write token for the release automation
        id: generate_write_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
            app-id: ${{ vars.POLKADOT_SDK_RELEASE_RW_APP_ID }}
            private-key: ${{ secrets.POLKADOT_SDK_RELEASE_RW_APP_KEY }}
            owner: paritytech
            repositories: polkadot-sdk

      - name: Download runtimes artifacts
        if: ${{ inputs.no_runtimes == false && inputs.crates_only == false }}
        env:
          GITHUB_TOKEN: ${{ steps.generate_write_token.outputs.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/runtimes/"
          gh run download "$BUILD_RUN_ID" --dir "${GITHUB_WORKSPACE}/runtimes"
          ls -la "${GITHUB_WORKSPACE}/runtimes"

      - name: Prepare tooling
        run: |
          URL=https://github.com/chevdor/tera-cli/releases/download/v0.4.0/tera-cli_linux_amd64.deb
          wget $URL -O tera.deb
          sudo dpkg -i tera.deb
          python3 -m pip install --user pyyaml

      - name: Prepare draft
        id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_HUB_WESTEND_DIGEST: ${{ github.workspace}}/runtimes/asset-hub-westend-runtime/asset-hub-westend-srtool-digest.json
          BRIDGE_HUB_WESTEND_DIGEST: ${{ github.workspace}}/runtimes/bridge-hub-westend-runtime/bridge-hub-westend-srtool-digest.json
          COLLECTIVES_WESTEND_DIGEST: ${{ github.workspace}}/runtimes/collectives-westend-runtime/collectives-westend-srtool-digest.json
          CORETIME_WESTEND_DIGEST: ${{ github.workspace}}/runtimes/coretime-westend-runtime/coretime-westend-srtool-digest.json
          GLUTTON_WESTEND_DIGEST: ${{ github.workspace}}/runtimes/glutton-westend-runtime/glutton-westend-srtool-digest.json
          PEOPLE_WESTEND_DIGEST: ${{ github.workspace}}/runtimes/people-westend-runtime/people-westend-srtool-digest.json
          WESTEND_DIGEST: ${{ github.workspace}}/runtimes/westend-runtime/westend-srtool-digest.json
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          NO_RUNTIMES: ${{ inputs.no_runtimes }}
          CRATES_ONLY: ${{ inputs.crates_only }}
          GH_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          . ./.github/scripts/common/lib.sh

          export RUSTC_STABLE=$(grep -oP '(?<=-)[0-9]+\.[0-9]+\.[0-9]+(?=-)' .github/env)

          if [[ -z "$RELEASE_TAG" ]]; then
            export REF2="${GH_REF_NAME}"
          else
            export REF2="$RELEASE_TAG"
          fi
          echo "REF2: ${REF2}"
          echo "REL_TAG=$REF2" >> $GITHUB_ENV

          # Previous tag on the release timeline of the tag being drafted — NOT the
          # repo-wide "latest release", which belongs to a newer line when patching
          # an older stable release and would bake a wrong baseline into the
          # CHANGELOG.md/changelog.json assets.
          release_key() { # polkadot-stableYYMM[-N] -> sortable number
            local t="${1#polkadot-}"; t="${t#stable}"; local n=0
            if [[ "$t" == *-* ]]; then n="${t#*-}"; t="${t%%-*}"; fi
            echo $(( 10#$t * 1000 + 10#$n ))
          }
          target_key=$(release_key "${REF2%-rc*}")
          export REF1=$(gh api --paginate repos/paritytech/polkadot-sdk/releases --jq '.[].tag_name' \
            | { grep -E '^polkadot-stable[0-9]{4}(-[0-9]+)?$' || true; } \
            | while read -r tag; do
                key=$(release_key "$tag")
                if (( key < target_key )); then echo "$key $tag"; fi
              done | sort -n | tail -1 | cut -d' ' -f2)
          if [[ -z "$REF1" ]]; then
            export REF1=$(get_latest_release_tag)
          fi
          echo "REF1: ${REF1}"
          export VERSION=$(echo "$REF2" | sed -E 's/.*(stable[0-9]{4}(-[0-9]+)?).*$/\1/')
          echo "Version: $VERSION"

          export STABLE_VERSION=$(sed -E 's/.*(stable[0-9]{4}).*$/\1/' <<< "$VERSION")
          export NODE_VERSION=v$(get_polkadot_node_version_from_code)
          export GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          ./scripts/release/build-changelogs.sh

      - name: Archive artifact context.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes-context
          path: |
            scripts/release/context.json
            scripts/release/RELEASE_DRAFT.md
            scripts/release/CHANGELOG.md
            scripts/release/changelog.json
            **/*-srtool-digest.json

      - name: Create draft release
        id: create-release
        env:
          GITHUB_TOKEN: ${{ steps.generate_write_token.outputs.token }}
          RELEASE_NOTES: ${{ github.workspace }}/scripts/release/RELEASE_DRAFT.md
        run: |
          # GitHub caps the release body at 125000 characters. If the generated
          # notes exceed that, `gh release create` fails with a 422 and the whole
          # release (including the artifacts attached by the downstream jobs) is
          # never published. Instead of failing, fall back to a short placeholder
          # body so the draft is created and the artifacts still get attached; the
          # full notes remain available via the `release-notes-context` artifact.
          MAX_BODY_LENGTH=125000
          NOTES_FILE="$RELEASE_NOTES"
          BODY_LENGTH=$(wc -m < "$NOTES_FILE")

          if [[ "$BODY_LENGTH" -gt "$MAX_BODY_LENGTH" ]]; then
            echo "::warning::Release notes are ${BODY_LENGTH} characters, exceeding the GitHub limit of ${MAX_BODY_LENGTH}. Publishing the draft with a placeholder body; artifacts will still be attached and the full notes are available in the 'release-notes-context' artifact."
            NOTES_FILE="${{ github.workspace }}/scripts/release/RELEASE_DRAFT_FALLBACK.md"
            printf '%s\n' \
              "The auto-generated release notes exceeded GitHub's maximum release body size (${MAX_BODY_LENGTH} characters) and were omitted from this draft." \
              "" \
              "The full release notes are available in the \`release-notes-context\` artifact of the release workflow run and should be added to this draft manually." \
              > "$NOTES_FILE"
          fi

          gh release create ${{ env.REL_TAG }} \
            --repo paritytech/polkadot-sdk \
            --draft \
            --title "Polkadot ${{ env.REL_TAG }}" \
            --notes-file "$NOTES_FILE"

          # Attach the complete changelog and its machine-readable form as
          # release assets; the release body only carries a condensed version.
          gh release upload ${{ env.REL_TAG }} \
            --repo paritytech/polkadot-sdk \
            "${{ github.workspace }}/scripts/release/CHANGELOG.md" \
            "${{ github.workspace }}/scripts/release/changelog.json"

  publish-runtimes:
    if: ${{ inputs.crates_only == false && inputs.no_runtimes == false }}
    needs: [ validate-inputs, publish-release-draft ]
    environment: release
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(inputs.runtimes) }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate content write token for the release automation
        id: generate_write_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
            app-id: ${{ vars.POLKADOT_SDK_RELEASE_RW_APP_ID }}
            private-key: ${{ secrets.POLKADOT_SDK_RELEASE_RW_APP_KEY }}
            owner: paritytech
            repositories: polkadot-sdk

      # The build run's per-runtime artifacts carry both the compressed wasm and
      # the srtool digest, so this is the only download this job needs.
      - name: Download runtimes
        env:
          GITHUB_TOKEN: ${{ steps.generate_write_token.outputs.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/runtimes/"
          gh run download "$BUILD_RUN_ID" --dir "${GITHUB_WORKSPACE}/runtimes"
          ls -la "${GITHUB_WORKSPACE}/runtimes"

      - name: Get runtime info
        env:
          CHAIN: ${{ matrix.chain }}
          JSON: ${{ github.workspace }}/runtimes/${{ matrix.chain }}-runtime/${{ matrix.chain }}-srtool-digest.json
        run: |
          cd "${GITHUB_WORKSPACE}/runtimes"
          >>$GITHUB_ENV echo ASSET=$(find "${CHAIN}-runtime" -name '*.compact.compressed.wasm')
          >>$GITHUB_ENV echo SPEC=$(<${JSON} jq -r .runtimes.compact.subwasm.core_version.specVersion)

      - name: Upload compressed ${{ matrix.chain }} v${{ env.SPEC }} wasm
        working-directory: ${{ github.workspace}}/runtimes
        env:
          GITHUB_TOKEN: ${{ steps.generate_write_token.outputs.token }}
          CHAIN: ${{ matrix.chain }}
          VALIDATED_RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
        run: |
          VERSIONED_ASSET="${CHAIN}_runtime-v${{ env.SPEC }}.compact.compressed.wasm"
          mv "${{ env.ASSET }}" "$VERSIONED_ASSET"

          gh release upload "$VALIDATED_RELEASE_TAG" \
            --repo paritytech/polkadot-sdk "$VERSIONED_ASSET"

  publish-release-artifacts:
    if: ${{ inputs.crates_only == false }}
    needs: [ validate-inputs, publish-release-draft ]
    environment: release
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binary: [ polkadot, polkadot-execute-worker, polkadot-prepare-worker, polkadot-parachain, polkadot-omni-node, frame-omni-bencher, chain-spec-builder, eth-rpc ]
        target: [ x86_64-unknown-linux-gnu, aarch64-apple-darwin ]

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch binaries from s3 based on version
        env:
          VERSION: ${{ needs.validate-inputs.outputs.release_tag }}
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        run: |
          . ./.github/scripts/common/lib.sh

          fetch_release_artifacts_from_s3 "$BINARY" "$TARGET"

      - name: Rename aarch64-apple-darwin binaries
        if: ${{ matrix.target == 'aarch64-apple-darwin' }}
        working-directory: ${{ github.workspace}}/release-artifacts/${{ matrix.target }}/${{ matrix.binary }}
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          . ../../../.github/scripts/common/lib.sh

          mv "$BINARY" "${BINARY}-aarch64-apple-darwin"
          mv "${BINARY}.asc" "${BINARY}-aarch64-apple-darwin.asc"

          sha256sum "${BINARY}-aarch64-apple-darwin" | tee "${BINARY}-aarch64-apple-darwin.sha256"
          check_sha256 "${BINARY}-aarch64-apple-darwin" && echo "OK" || echo "ERR"

      - name: Generate content write token for the release automation
        id: generate_write_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
            app-id: ${{ vars.POLKADOT_SDK_RELEASE_RW_APP_ID }}
            private-key: ${{ secrets.POLKADOT_SDK_RELEASE_RW_APP_KEY }}
            owner: paritytech
            repositories: polkadot-sdk

      - name: Upload ${{ matrix.binary }} binary to release draft
        env:
          GITHUB_TOKEN: ${{ steps.generate_write_token.outputs.token }}
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
          VALIDATED_RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
        working-directory: ${{ github.workspace}}/release-artifacts/${{ matrix.target }}/${{ matrix.binary }}
        run: |
          if [[ "$TARGET" == "aarch64-apple-darwin" ]]; then
            gh release upload "$VALIDATED_RELEASE_TAG" \
              --repo paritytech/polkadot-sdk \
              "${BINARY}-aarch64-apple-darwin" \
              "${BINARY}-aarch64-apple-darwin.asc" \
              "${BINARY}-aarch64-apple-darwin.sha256"
          else
            gh release upload "$VALIDATED_RELEASE_TAG" \
              --repo paritytech/polkadot-sdk \
              "$BINARY" \
              "${BINARY}.asc" \
              "${BINARY}.sha256"
          fi

  post_to_matrix:
    runs-on: ubuntu-latest
    needs: [ validate-inputs, publish-release-draft ]
    environment: release
    strategy:
      matrix:
        channel:
          - name: "Team: RelEng Internal"
            room: '!GvAyzgCDgaVrvibaAF:parity.io'

    steps:
      - name: Send Matrix message to ${{ matrix.channel.name }}
        uses: s3krit/matrix-message-action@70ad3fb812ee0e45ff8999d6af11cafad11a6ecf # v0.0.3
        with:
          room_id: ${{ matrix.channel.room }}
          access_token: ${{ secrets.RELEASENOTES_MATRIX_V2_ACCESS_TOKEN }}
          server: m.parity.io
          message: |
            **New version of polkadot tagged**: ${{ needs.validate-inputs.outputs.release_tag }}<br/>
            And release draft is release created in [polkadot-sdk repo](https://github.com/paritytech/polkadot-sdk/releases)
